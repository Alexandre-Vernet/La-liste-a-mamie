<nav class="bottom-nav" aria-label="Navigation principale">
  <span class="indicator" [style.transform]="indicatorTransform()"></span>

  @for (link of links; track link.path; let i = $index) {
    <a
      [routerLink]="link.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.exact }"
      (isActiveChange)="onActiveChange(i, $event)"
      class="tab"
    >
      @switch (link.path) {
        @case ('/') {
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M4 9h16l-1.5 10.5a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5L4 9Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path
              d="M8 9V7a4 4 0 0 1 8 0v2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        }
        @case ('/produits') {
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect
              x="4"
              y="4"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <rect
              x="13"
              y="4"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <rect
              x="4"
              y="13"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
            <rect
              x="13"
              y="13"
              width="7"
              height="7"
              rx="1.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
        }
      }
      <span>{{ link.label }}</span>
    </a>
  }
</nav>
