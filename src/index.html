<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>La liste à mamie</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash du mauvais thème.
      // La clé 'theme-preference' et la logique (thème enregistré, sinon thème système au
      // premier lancement) doivent rester synchronisées avec ThemeService.
      (function () {
        var stored = localStorage.getItem('theme-preference');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&amp;family=Inter:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
